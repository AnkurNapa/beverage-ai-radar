name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths: [dashboard/**, data/resources/**, scripts/build_resources.py, .github/workflows/pages.yml]
  schedule:
    - cron: "17 6 * * *"   # daily: auto-pull newest blog posts into the radar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh resources (auto-pull newest blog posts)
        run: python3 scripts/build_resources.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
