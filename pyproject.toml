[project]
name = "beverage-ai-radar"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
