<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beverage-AI Radar</title>
  <meta name="description" content="Companies applying AI to beer, whiskey, and wine. Live landscape radar." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="brand"><span aria-hidden="true">📡</span> Beverage-AI Radar</div>
    <p class="tag">Who is applying AI to beer, whiskey, and wine. <span id="meta"></span></p>
  </header>

  <main class="wrap">
    <section class="breakdowns" aria-label="Breakdowns">
      <div class="card"><h2>By vertical</h2><div id="bd-vertical" class="bars"></div></div>
      <div class="card"><h2>By AI use case</h2><div id="bd-usecase" class="bars"></div></div>
      <div class="card"><h2>By maturity</h2><div id="bd-maturity" class="bars"></div></div>
    </section>

    <section class="controls" aria-label="Filters">
      <input id="q" type="search" placeholder="Search name, location, description…" aria-label="Search" />
      <select id="f-vertical" aria-label="Vertical"><option value="">All verticals</option></select>
      <select id="f-usecase" aria-label="Use case"><option value="">All use cases</option></select>
      <select id="f-maturity" aria-label="Maturity"><option value="">All maturity</option></select>
      <select id="f-status" aria-label="Status">
        <option value="">Active + dormant</option>
        <option value="active">Active only</option>
        <option value="dormant">Dormant only</option>
      </select>
      <span id="count" class="count"></span>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="foot">Static radar. Data regenerated by <code>src/radar.py</code>. No account, no tracking.</footer>

  <script type="module" src="app.js"></script>
</body>
</html>
